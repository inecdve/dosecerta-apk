name: Gerar APK DoseCerta

on:name: Gerar APK DoseCerta

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Criar arquivos do projeto Android e compilar APK
        run: |
          mkdir -p app/src/main/java/com/dosecerta/app app/src/main/assets app/src/main/res/drawable
          cat << 'EOF' > settings.gradle
          rootProject.name = "DoseCerta"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dosecerta.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dosecerta.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0D9488" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#115E59" android:pathData="M54,14A40,40 0 1,1 54,94A40,40 0 1,1 54,14z" />
              <path android:fillColor="#99F6E4" android:pathData="M50,24h8v8h8v8h-8v8h-8v-8h-8v-8h8z" />
              <path android:fillColor="#FFFFFF" android:pathData="M30,56C30,49.4 35.4,44 42,44H54V68H42C35.4,68 30,62.6 30,56Z" />
              <path android:fillColor="#FBBF24" android:pathData="M54,44H66C72.6,44 78,49.4 78,56C78,62.6 72.6,68 66,68H54V44Z" />
              <path android:fillColor="#5EEAD4" android:pathData="M48,80L41,73L44.5,69.5L48,73L63.5,57.5L67,61L48,80Z" />
          </vector>
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="DoseCerta"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/dosecerta/app/MainActivity.java
          package com.dosecerta.app;
          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.os.*;
          import android.webkit.*;
          import org.json.*;
          import java.util.Calendar;
          public class MainActivity extends Activity {
              public static final String CHANNEL_ID = "dosecerta_alarms";
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Lembretes de Remedios", NotificationManager.IMPORTANCE_HIGH);
                      ch.enableVibration(true);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                  }
                  WebView wv = new WebView(this);
                  setContentView(wv);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.addJavascriptInterface(new Bridge(this), "AndroidBridge");
                  wv.loadUrl("file:///android_asset/index.html");
              }
              public static class Bridge {
                  Context ctx;
                  Bridge(Context c) { ctx = c; }
                  @JavascriptInterface
                  public void syncAlarms(String json) {
                      try {
                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                          if (am == null) return;
                          JSONArray arr = new JSONArray(json);
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject m = arr.getJSONObject(i);
                              String name = m.optString("name", "Remedio");
                              String dose = m.optString("dose", "1") + " " + m.optString("unit", "comp");
                              JSONArray times = m.optJSONArray("times");
                              if (times == null) continue;
                              for (int j = 0; j < times.length(); j++) {
                                  String t = times.getString(j);
                                  String[] p = t.split(":");
                                  Calendar cal = Calendar.getInstance();
                                  cal.set(Calendar.HOUR_OF_DAY, Integer.parseInt(p[0]));
                                  cal.set(Calendar.MINUTE, Integer.parseInt(p[1]));
                                  cal.set(Calendar.SECOND, 0);
                                  if (cal.getTimeInMillis() <= System.currentTimeMillis()) cal.add(Calendar.DAY_OF_YEAR, 1);
                                  Intent in = new Intent(ctx, AlarmReceiver.class);
                                  in.putExtra("title", "Hora do Remedio: " + name);
                                  in.putExtra("body", "Tomar " + dose + " (" + t + ")");
                                  PendingIntent pi = PendingIntent.getBroadcast(ctx, (name + t).hashCode(), in, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF
          cat << 'EOF' > app/src/main/java/com/dosecerta/app/AlarmReceiver.java
          package com.dosecerta.app;
          import android.app.*;
          import android.content.*;
          import android.os.Build;
          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent in) {
                  String title = in.getStringExtra("title");
                  String body = in.getStringExtra("body");
                  PendingIntent pi = PendingIntent.getActivity(ctx, 0, new Intent(ctx, MainActivity.class), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(ctx, MainActivity.CHANNEL_ID) : new Notification.Builder(ctx);
                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setContentTitle(title).setContentText(body).setAutoCancel(true).setContentIntent(pi);
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify((int)(System.currentTimeMillis() & 0xfffffff), b.build());
              }
          }
          EOF
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DoseCerta</title>
          <style>
          *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:#f1f5f9;color:#0f172a;padding-bottom:80px}
          header{background:#0d9488;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.12)}
          .card{background:#fff;border-radius:14px;padding:14px;margin:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid #0d9488}
          .btn{border:none;border-radius:10px;padding:8px 12px;font-weight:600;font-size:12px;cursor:pointer}
          .btn-primary{background:#0d9488;color:#fff}
          .btn-outline{background:#e2e8f0;color:#334155}
          .btn-edit{background:#dbeafe;color:#1d4ed8}
          .btn-danger{background:#fee2e2;color:#be123c}
          input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0 10px;font-size:14px;background:#fff}
          label{font-size:12px;font-weight:600;color:#334155}
          nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0;z-index:20}
          nav button{background:none;border:none;font-size:11px;font-weight:600;color:#64748b;padding:6px}
          nav button.active{color:#0d9488;font-weight:700}
          .badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#ccfbf1;color:#115e59;font-weight:700}
          .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
          .cal-head{text-align:center;font-size:10px;font-weight:700;color:#64748b;padding:4px 0}
          .cal-day{height:38px;border-radius:10px;border:1px solid #e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;background:#f8fafc}
          .cal-day.taken{background:#dcfce7;border-color:#86efac;color:#166534}
          .cal-day.partial{background:#fef3c7;border-color:#fcd34d;color:#92400e}
          .cal-day.missed{background:#ffe4e6;border-color:#fda4af;color:#9f1239}
          .cal-day.selected{outline:2px solid #0d9488;outline-offset:1px}
          .dot{width:5px;height:5px;border-radius:50%;margin-top:2px}
          #alarmBanner{display:none;background:#e11d48;color:#fff;padding:14px;margin:10px 14px;border-radius:12px}
          </style></head><body>
          <header><div><strong style="font-size:17px">DoseCerta</strong><div id="clock" style="font-size:11px;opacity:.9"></div></div><button class="btn" style="background:rgba(255,255,255,.2);color:#fff" onclick="testAlarm()">Testar Alarme</button></header>
          <div id="alarmBanner"><strong id="alarmText">Hora do Remédio!</strong><div style="margin-top:8px;display:flex;gap:8px"><button class="btn" style="background:#fff;color:#e11d48" onclick="stopAlarm()">Silenciar</button></div></div>
          <div id="view-hoje"></div>
          <div id="view-calendario" style="display:none">
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <button class="btn btn-outline" onclick="changeMonth(-1)">◀</button>
                <strong id="calTitle" style="font-size:14px;text-transform:capitalize"></strong>
                <button class="btn btn-outline" onclick="changeMonth(1)">▶</button>
              </div>
              <div style="display:flex;gap:10px;font-size:11px;color:#475569;margin-bottom:6px;flex-wrap:wrap">
                <span>🟢 Tudo tomado</span><span>🟡 Parcial</span><span>🔴 Esquecido</span>
              </div>
              <div class="cal-grid">
                <div class="cal-head">Dom</div><div class="cal-head">Seg</div><div class="cal-head">Ter</div><div class="cal-head">Qua</div><div class="cal-head">Qui</div><div class="cal-head">Sex</div><div class="cal-head">Sáb</div>
              </div>
              <div id="calGrid" class="cal-grid"></div>
            </div>
            <div class="card">
              <strong id="calDayTitle" style="font-size:14px">Detalhes do Dia</strong>
              <p style="font-size:11px;color:#64748b;margin:2px 0 10px">Toque em Tomado ou Esqueci para registrar ou corrigir qualquer dia:</p>
              <div id="calDayList"></div>
            </div>
          </div>
          <div id="view-remedios" style="display:none">
            <div class="card" id="medFormCard">
              <h3 id="formTitle" style="margin:0 0 10px;font-size:15px">Novo Medicamento</h3>
              <input id="editId" type="hidden" value="">
              <label>Nome do Medicamento</label><input id="mName" placeholder="Ex: Losartana 50mg">
              <label>Dose</label><input id="mDose" type="number" step="0.5" value="1">
              <label>Unidade</label><select id="mUnit"><option>comprimido(s)</option><option>cápsula(s)</option><option>gota(s)</option><option>ml</option></select>
              <label>Horários (separados por vírgula)</label><input id="mTimes" value="08:00, 20:00">
              <label>Estoque Atual</label><input id="mStock" type="number" value="30">
              <div style="display:flex;gap:8px">
                <button id="btnSaveMed" class="btn btn-primary" style="flex:1" onclick="saveMed()">Salvar Medicamento</button>
                <button id="btnCancelEdit" class="btn btn-outline" style="display:none" onclick="cancelEdit()">Cancelar</button>
              </div>
            </div>
            <div id="medList"></div>
          </div>
          <div id="view-saude" style="display:none">
            <div class="card"><h3 style="margin:0 0 10px;font-size:15px">Registrar Medição / Sintoma</h3>
              <select id="hType"><option>Pressão Arterial</option><option>Glicemia</option><option>Peso</option><option>Sintoma</option></select>
              <input id="hVal" placeholder="Ex: 120/80 mmHg">
              <button class="btn $1" style="width:100%" onclick="addHealth()">Salvar Registro</button>
            </div>
            <div id="healthList"></div>
          </div>
          <nav>
            <button id="tab-hoje" class="active" onclick="showTab('hoje')">Hoje</button>
            <button id="tab-calendario" onclick="showTab('calendario')">Calendário</button>
            <button id="tab-remedios" onclick="showTab('remedios')">Remédios</button>
            <button id="tab-saude" onclick="showTab('saude')">Saúde</button>
          </nav>
          <script>
          let state = JSON.parse(localStorage.getItem('dc_state') || '{"meds":[{"id":1,"name":"Losartana 50mg","dose":1,"unit":"comprimido(s)","times":["08:00","20:00"],"stock":28}],"taken":{},"skipped":{},"health":[]}');
          if(!state.skipped) state.skipped = {};
          let fired = {};
          let calNow = new Date();
          let calYear = calNow.getFullYear(), calMonth = calNow.getMonth();
          function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
          let selDate = todayStr();
          function save(){localStorage.setItem('dc_state',JSON.stringify(state));if(window.AndroidBridge)window.AndroidBridge.syncAlarms(JSON.stringify(state.meds));render();}
          function showTab(t){['hoje','calendario','remedios','saude'].forEach(x=>{document.getElementById('view-'+x).style.display=x===t?'block':'none';document.getElementById('tab-'+x).className=x===t?'active':'';});render();}
          function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=0.2;o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*0.18);o.stop(c.currentTime+i*0.18+0.15);});}catch(e){}}
          function testAlarm(){document.getElementById('alarmText').textContent='Alarme: Hora de tomar seu medicamento!';document.getElementById('alarmBanner').style.display='block';beep();}
          function stopAlarm(){document.getElementById('alarmBanner').style.display='none';}
          function takeDose(id,t,dateOverride){const d=dateOverride||todayStr(),k=d+'_'+id+'_'+t;delete state.skipped[k];if(!state.taken[k]){state.taken[k]=new Date().toTimeString().slice(0,5);const m=state.meds.find(x=>x.id===id);if(m&&m.stock>0)m.stock-=Number(m.dose);}beep();save();}
          function skipDose(id,t,dateOverride){const d=dateOverride||todayStr(),k=d+'_'+id+'_'+t;if(state.taken[k]){delete state.taken[k];const m=state.meds.find(x=>x.id===id);if(m)m.stock+=Number(m.dose);}state.skipped[k]=true;save();}
          function undoDose(id,t,dateOverride){const d=dateOverride||todayStr(),k=d+'_'+id+'_'+t;if(state.taken[k]){delete state.taken[k];const m=state.meds.find(x=>x.id===id);if(m)m.stock+=Number(m.dose);}delete state.skipped[k];save();}
          function editMed(id){
            const m=state.meds.find(x=>x.id===id);if(!m)return;
            document.getElementById('editId').value=String(m.id);
            document.getElementById('mName').value=m.name;
            document.getElementById('mDose').value=m.dose;
            document.getElementById('mUnit').value=m.unit;
            document.getElementById('mTimes').value=(m.times||[]).join(', ');
            document.getElementById('mStock').value=m.stock;
            document.getElementById('formTitle').textContent='Editar Medicamento';
            document.getElementById('btnSaveMed').textContent='Salvar Alterações';
            document.getElementById('btnCancelEdit').style.display='inline-block';
            window.scrollTo({top:0,behavior:'smooth'});
          }
          function cancelEdit(){
            document.getElementById('editId').value='';
            document.getElementById('mName').value='';
            document.getElementById('mDose').value='1';
            document.getElementById('mTimes').value='08:00, 20:00';
            document.getElementById('mStock').value='30';
            document.getElementById('formTitle').textContent='Novo Medicamento';
            document.getElementById('btnSaveMed').textContent='Salvar Medicamento';
            document.getElementById('btnCancelEdit').style.display='none';
          }
          function saveMed(){
            const n=document.getElementById('mName').value.trim();if(!n)return;
            const editId=document.getElementById('editId').value;
            const payload={
              id:editId?Number(editId):Date.now(),
              name:n,
              dose:Number(document.getElementById('mDose').value)||1,
              unit:document.getElementById('mUnit').value,
              times:document.getElementById('mTimes').value.split(',').map(s=>s.trim()).filter(Boolean),
              stock:Number(document.getElementById('mStock').value)||0
            };
            if(editId){
              const idx=state.meds.findIndex(x=>String(x.id)===String(editId));
              if(idx>=0)state.meds[idx]=payload;
            }else{
              state.meds.push(payload);
            }
            cancelEdit();save();
          }
          function delMed(id){state.meds=state.meds.filter(x=>x.id!==id);if(document.getElementById('editId').value===String(id))cancelEdit();save();}
          function addHealth(){const v=document.getElementById('hVal').value.trim();if(!v)return;state.health.unshift({t:document.getElementById('hType').value,v:v,d:new Date().toLocaleString('pt-BR')});document.getElementById('hVal').value='';save();}
          function changeMonth(delta){calMonth+=delta;if(calMonth<0){calMonth=11;calYear--;}if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
          function selectCalDate(dStr){selDate=dStr;renderCalendar();}
          function renderCalendar(){
            const first=new Date(calYear,calMonth,1),days=new Date(calYear,calMonth+1,0).getDate(),startW=first.getDay(),tStr=todayStr();
            document.getElementById('calTitle').textContent=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
            let sched=[];state.meds.forEach(m=>(m.times||[]).forEach(t=>sched.push({m,t})));sched.sort((a,b)=>a.t.localeCompare(b.t));
            let html='';for(let i=0;i<startW;i++)html+='<div></div>';
            for(let d=1;d<=days;d++){
              const dStr=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
              let takenC=0,skipC=0;
              sched.forEach(s=>{const k=dStr+'_'+s.m.id+'_'+s.t;if(state.taken[k])takenC++;if(state.skipped[k])skipC++;});
              let cls='cal-day',dotColor='transparent';
              if(dStr<=tStr&&sched.length>0){
                if(takenC===sched.length){cls+=' taken';dotColor='#16a34a';}
                else if(takenC>0){cls+=' partial';dotColor='#d97706';}
                else if(dStr<tStr||skipC>0){cls+=' missed';dotColor='#e11d48';}
              }
              if(dStr===selDate)cls+=' selected';
              html+=`<div class="${cls}" onclick="selectCalDate('${dStr}')"><span>${d}</span><span class="dot" style="background:${dotColor}"></span></div>`;
            }
            document.getElementById('calGrid').innerHTML=html;
            const p=selDate.split('-');
            document.getElementById('calDayTitle').textContent=`Dia ${p[2]}/${p[1]}/${p[0]}`;
            document.getElementById('calDayList').innerHTML=sched.map(s=>{
              const k=selDate+'_'+s.m.id+'_'+s.t,isT=state.taken[k],isS=state.skipped[k]||(selDate<tStr&&!isT);
              return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9">
                <div><span class="badge">${s.t}</span> <strong style="font-size:13px">${s.m.name}</strong><div style="font-size:11px;color:#64748b;margin-top:2px">${isT?'✓ Tomado ('+isT+')':(isS?'✕ Esquecido / Não tomado':'Pendente')}</div></div>
                <div style="display:flex;gap:5px">
                  <button class="btn ${isT?'btn-primary':'btn-outline'}" onclick="takeDose(${s.m.id},'${s.t}','${selDate}')">Tomado</button>
                  <button class="btn ${state.skipped[k]?'btn-danger':'btn-outline'}" onclick="skipDose(${s.m.id},'${s.t}','${selDate}')">Esqueci</button>
                </div>
              </div>`;
            }).join('')||'<div style="font-size:12px;color:#64748b">Nenhum medicamento cadastrado.</div>';
          }
          function render(){
            const today=todayStr();
            let doses=[];
            state.meds.forEach(m=>(m.times||[]).forEach(t=>doses.push({m,t,k:today+'_'+m.id+'_'+t})));
            doses.sort((a,b)=>a.t.localeCompare(b.t));
            document.getElementById('view-hoje').innerHTML=doses.map(d=>{const done=state.taken[d.k],sk=state.skipped[d.k];return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><span class="badge">${d.t}</span> <strong style="margin-left:6px">${d.m.name}</strong><div style="font-size:12px;color:#64748b;margin-top:4px">Dose: ${d.m.dose} ${d.m.unit} • Estoque: ${d.m.stock}</div></div>${done?`<button class="btn btn-outline" onclick="undoDose(${d.m.id},'${d.t}')">✓ ${done}</button>`:(sk?`<button class="btn btn-danger" onclick="undoDose(${d.m.id},'${d.t}')">✕ Esquecido</button>`:`<div style="display:flex;gap:5px"><button class="btn btn-outline" onclick="skipDose(${d.m.id},'${d.t}')">Esqueci</button><button class="btn btn-primary" onclick="takeDose(${d.m.id},'${d.t}')">Confirmar</button></div>`)}</div></div>`;}).join('')||'<div class="card">Nenhum horário cadastrado.</div>';
            document.getElementById('medList').innerHTML=state.meds.map(m=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><strong>${m.name}</strong><div style="font-size:12px;color:#64748b">${m.dose} ${m.unit} • Horários: ${m.times.join(', ')} • Estoque: ${m.stock}</div></div><div style="display:flex;gap:6px"><button class="btn btn-edit" onclick="editMed(${m.id})">Editar</button><button class="btn btn-danger" onclick="delMed(${m.id})">Excluir</button></div></div></div>`).join('');
            document.getElementById('healthList').innerHTML=state.health.map(h=>`<div class="card"><strong>${h.t}: ${h.v}</strong><div style="font-size:11px;color:#64748b">${h.d}</div></div>`).join('');
            renderCalendar();
          }
          setInterval(()=>{const now=new Date(),hhmm=now.toTimeString().slice(0,5),today=todayStr();document.getElementById('clock').textContent=now.toLocaleTimeString('pt-BR');state.meds.forEach(m=>(m.times||[]).forEach(t=>{const k=today+'_'+m.id+'_'+t;if(t===hhmm&&!state.taken[k]&&!state.skipped[k]&&!fired[k]){fired[k]=1;testAlarm();}}));},1000);
          save();
          </script></body></html>
          EOF
          gradle assembleDebug
      - name: Publicar APK como Release e Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DoseCerta.apk
          gh release create v2.0.${{ github.run_number }} DoseCerta.apk --title "DoseCerta APK v2.0.${{ github.run_number }}" --notes "APK atualizado com Calendario Mensal de Adesao (dias tomados e esquecidos), Edicao de Medicamentos e Icone personalizado." || true
      - uses: actions/upload-artifact@v4
        with:
          name: DoseCerta-APK
          path: DoseCerta.apk
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Criar arquivos do projeto Android e compilar APK
        run: |
          mkdir -p app/src/main/java/com/dosecerta/app app/src/main/assets
          cat << 'EOF' > settings.gradle
          rootProject.name = "DoseCerta"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.dosecerta.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.dosecerta.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application android:allowBackup="true" android:label="DoseCerta" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/dosecerta/app/MainActivity.java
          package com.dosecerta.app;
          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.os.*;
          import android.webkit.*;
          import org.json.*;
          import java.util.Calendar;
          public class MainActivity extends Activity {
              public static final String CHANNEL_ID = "dosecerta_alarms";
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "Lembretes de Remedios", NotificationManager.IMPORTANCE_HIGH);
                      ch.enableVibration(true);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                  }
                  WebView wv = new WebView(this);
                  setContentView(wv);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.addJavascriptInterface(new Bridge(this), "AndroidBridge");
                  wv.loadUrl("file:///android_asset/index.html");
              }
              public static class Bridge {
                  Context ctx;
                  Bridge(Context c) { ctx = c; }
                  @JavascriptInterface
                  public void syncAlarms(String json) {
                      try {
                          AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                          if (am == null) return;
                          JSONArray arr = new JSONArray(json);
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject m = arr.getJSONObject(i);
                              String name = m.optString("name", "Remedio");
                              String dose = m.optString("dose", "1") + " " + m.optString("unit", "comp");
                              JSONArray times = m.optJSONArray("times");
                              if (times == null) continue;
                              for (int j = 0; j < times.length(); j++) {
                                  String t = times.getString(j);
                                  String[] p = t.split(":");
                                  Calendar cal = Calendar.getInstance();
                                  cal.set(Calendar.HOUR_OF_DAY, Integer.parseInt(p[0]));
                                  cal.set(Calendar.MINUTE, Integer.parseInt(p[1]));
                                  cal.set(Calendar.SECOND, 0);
                                  if (cal.getTimeInMillis() <= System.currentTimeMillis()) cal.add(Calendar.DAY_OF_YEAR, 1);
                                  Intent in = new Intent(ctx, AlarmReceiver.class);
                                  in.putExtra("title", "Hora do Remedio: " + name);
                                  in.putExtra("body", "Tomar " + dose + " (" + t + ")");
                                  PendingIntent pi = PendingIntent.getBroadcast(ctx, (name + t).hashCode(), in, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }
          }
          EOF
          cat << 'EOF' > app/src/main/java/com/dosecerta/app/AlarmReceiver.java
          package com.dosecerta.app;
          import android.app.*;
          import android.content.*;
          import android.os.Build;
          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent in) {
                  String title = in.getStringExtra("title");
                  String body = in.getStringExtra("body");
                  PendingIntent pi = PendingIntent.getActivity(ctx, 0, new Intent(ctx, MainActivity.class), PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(ctx, MainActivity.CHANNEL_ID) : new Notification.Builder(ctx);
                  b.setSmallIcon(android.R.drawable.ic_lock_idle_alarm).setContentTitle(title).setContentText(body).setAutoCancel(true).setContentIntent(pi);
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify((int)(System.currentTimeMillis() & 0xfffffff), b.build());
              }
          }
          EOF
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DoseCerta</title>
          <style>
          *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
          body{margin:0;background:#f1f5f9;color:#0f172a;padding-bottom:76px}
          header{background:#0d9488;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.12)}
          .card{background:#fff;border-radius:14px;padding:14px;margin:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid #0d9488}
          .btn{border:none;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer}
          .btn-primary{background:#0d9488;color:#fff}
          .btn-outline{background:#e2e8f0;color:#334155}
          .btn-danger{background:#fee2e2;color:#be123c}
          input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0 10px;font-size:14px}
          nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0}
          nav button{background:none;border:none;font-size:12px;font-weight:600;color:#64748b;padding:6px}
          nav button.active{color:#0d9488}
          .badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#ccfbf1;color:#115e59;font-weight:700}
          #alarmBanner{display:none;background:#e11d48;color:#fff;padding:14px;margin:10px 14px;border-radius:12px}
          </style></head><body>
          <header><div><strong style="font-size:17px">DoseCerta</strong><div id="clock" style="font-size:11px;opacity:.9"></div></div><button class="btn btn-outline" style="background:rgba(255,255,255,.2);color:#fff" onclick="testAlarm()">Testar Alarme</button></header>
          <div id="alarmBanner"><strong id="alarmText">Hora do Remédio!</strong><div style="margin-top:8px;display:flex;gap:8px"><button class="btn" style="background:#fff;color:#e11d48" onclick="stopAlarm()">Silenciar</button></div></div>
          <div id="view-hoje"></div>
          <div id="view-remedios" style="display:none">
            <div class="card"><h3>Novo Medicamento</h3>
              <label>Nome</label><input id="mName" placeholder="Ex: Losartana 50mg">
              <label>Dose</label><input id="mDose" type="number" value="1">
              <label>Unidade</label><select id="mUnit"><option>comprimido(s)</option><option>cápsula(s)</option><option>gota(s)</option><option>ml</option></select>
              <label>Horários (separados por vírgula)</label><input id="mTimes" value="08:00, 20:00">
              <label>Estoque Atual</label><input id="mStock" type="number" value="30">
              <button class="btn btn-primary" style="width:100%" onclick="addMed()">Salvar Medicamento e Alarme</button>
            </div>
            <div id="medList"></div>
          </div>
          <div id="view-saude" style="display:none">
            <div class="card"><h3>Registrar Medição / Sintoma</h3>
              <select id="hType"><option>Pressão Arterial</option><option>Glicemia</option><option>Peso</option><option>Sintoma</option></select>
              <input id="hVal" placeholder="Ex: 120/80 mmHg">
              <button class="btn btn-primary" style="width:100%" onclick="addHealth()">Salvar Registro</button>
            </div>
            <div id="healthList"></div>
          </div>
          <nav>
            <button id="tab-hoje" class="active" onclick="showTab('hoje')">Hoje</button>
            <button id="tab-remedios" onclick="showTab('remedios')">Remédios</button>
            <button id="tab-saude" onclick="showTab('saude')">Saúde</button>
          </nav>
          <script>
          let state = JSON.parse(localStorage.getItem('dc_state') || '{"meds":[{"id":1,"name":"Losartana 50mg","dose":1,"unit":"comprimido(s)","times":["08:00","20:00"],"stock":28}],"taken":{},"health":[]}');
          let fired = {};
          function save(){localStorage.setItem('dc_state',JSON.stringify(state));if(window.AndroidBridge)window.AndroidBridge.syncAlarms(JSON.stringify(state.meds));render();}
          function showTab(t){['hoje','remedios','saude'].forEach(x=>{document.getElementById('view-'+x).style.display=x===t?'block':'none';document.getElementById('tab-'+x).className=x===t?'active':'';});render();}
          function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=0.2;o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*0.18);o.stop(c.currentTime+i*0.18+0.15);});}catch(e){}}
          function testAlarm(){document.getElementById('alarmText').textContent='Alarme: Hora de tomar seu medicamento!';document.getElementById('alarmBanner').style.display='block';beep();}
          function stopAlarm(){document.getElementById('alarmBanner').style.display='none';}
          function takeDose(id,t){const k=new Date().toISOString().slice(0,10)+'_'+id+'_'+t;if(!state.taken[k]){state.taken[k]=new Date().toTimeString().slice(0,5);const m=state.meds.find(x=>x.id===id);if(m&&m.stock>0)m.stock-=Number(m.dose);}beep();save();}
          function undoDose(id,t){const k=new Date().toISOString().slice(0,10)+'_'+id+'_'+t;if(state.taken[k]){delete state.taken[k];const m=state.meds.find(x=>x.id===id);if(m)m.stock+=Number(m.dose);save();}}
          function addMed(){const n=document.getElementById('mName').value.trim();if(!n)return;state.meds.push({id:Date.now(),name:n,dose:Number(document.getElementById('mDose').value)||1,unit:document.getElementById('mUnit').value,times:document.getElementById('mTimes').value.split(',').map(s=>s.trim()).filter(Boolean),stock:Number(document.getElementById('mStock').value)||0});document.getElementById('mName').value='';save();showTab('hoje');}
          function delMed(id){state.meds=state.meds.filter(x=>x.id!==id);save();}
          function addHealth(){const v=document.getElementById('hVal').value.trim();if(!v)return;state.health.unshift({t:document.getElementById('hType').value,v:v,d:new Date().toLocaleString('pt-BR')});document.getElementById('hVal').value='';save();}
          function render(){
            const today=new Date().toISOString().slice(0,10);
            let doses=[];
            state.meds.forEach(m=>(m.times||[]).forEach(t=>doses.push({m,t,k:today+'_'+m.id+'_'+t})));
            doses.sort((a,b)=>a.t.localeCompare(b.t));
            document.getElementById('view-hoje').innerHTML=doses.map(d=>{const done=state.taken[d.k];return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="badge">${d.t}</span> <strong style="margin-left:6px">${d.m.name}</strong><div style="font-size:12px;color:#64748b;margin-top:4px">Dose: ${d.m.dose} ${d.m.unit} • Estoque: ${d.m.stock}</div></div>${done?`<button class="btn btn-outline" onclick="undoDose(${d.m.id},'${d.t}')">✓ ${done}</button>`:`<button class="btn btn-primary" onclick="takeDose(${d.m.id},'${d.t}')">Confirmar</button>`}</div></div>`;}).join('')||'<div class="card">Nenhum horário cadastrado.</div>';
            document.getElementById('medList').innerHTML=state.meds.map(m=>`<div class="card"><div style="display:flex;justify-content:space-between"><div><strong>${m.name}</strong><div style="font-size:12px;color:#64748b">${m.dose} ${m.unit} • Horários: ${m.times.join(', ')} • Estoque: ${m.stock}</div></div><button class="btn btn-danger" onclick="delMed(${m.id})">Excluir</button></div></div>`).join('');
            document.getElementById('healthList').innerHTML=state.health.map(h=>`<div class="card"><strong>${h.t}: ${h.v}</strong><div style="font-size:11px;color:#64748b">${h.d}</div></div>`).join('');
          }
          setInterval(()=>{const now=new Date(),hhmm=now.toTimeString().slice(0,5),today=now.toISOString().slice(0,10);document.getElementById('clock').textContent=now.toLocaleTimeString('pt-BR');state.meds.forEach(m=>(m.times||[]).forEach(t=>{const k=today+'_'+m.id+'_'+t;if(t===hhmm&&!state.taken[k]&&!fired[k]){fired[k]=1;testAlarm();}}));},1000);
          save();
          </script></body></html>
          EOF
          gradle assembleDebug
      - name: Publicar APK como Release e Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DoseCerta.apk
          gh release create v1.0.${{ github.run_number }} DoseCerta.apk --title "DoseCerta APK v1.0.${{ github.run_number }}" --notes "APK Android leve e sem propagandas pronto para instalar." || true
      - uses: actions/upload-artifact@v4
        with:
          name: DoseCerta-APK
          path: DoseCerta.apk
